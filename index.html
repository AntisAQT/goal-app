<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milestone Goal Tracker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#0f0f0f;
  color:white;
  padding:18px;
}

.app{
  max-width:500px;
  margin:auto;
}

h1{
  text-align:center;
  margin:10px 0 4px;
}

.sub{
  text-align:center;
  color:#aaa;
  margin:0 0 22px;
}

.card{
  background:#1c1c1e;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
}

label{
  color:#aaa;
  font-size:14px;
}

input, textarea{
  width:100%;
  margin-top:8px;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#2c2c2e;
  color:white;
  font-size:16px;
}

textarea{
  min-height:90px;
}

.big{
  font-size:38px;
  font-weight:800;
  text-align:center;
  margin:14px 0 4px;
}

.center{
  text-align:center;
  color:#aaa;
}

.progress{
  width:100%;
  height:18px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  margin-top:18px;
}

.bar{
  height:100%;
  width:0%;
  background:#34c759;
  transition:.3s;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.stat{
  background:#2c2c2e;
  border-radius:16px;
  padding:12px;
  text-align:center;
}

.number{
  font-size:22px;
  font-weight:700;
}

.caption{
  color:#aaa;
  font-size:12px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  margin-top:12px;
}

.primary{
  background:#34c759;
  color:white;
}

.secondary{
  background:#2c2c2e;
  color:white;
}

.warning{
  background:#ff9f0a;
  color:black;
}

.danger{
  background:#ff453a;
  color:white;
}

.disabled{
  background:#3a3a3c;
  color:#999;
}

.milestone{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#2c2c2e;
  padding:13px;
  border-radius:15px;
  margin-top:9px;
}

.status{
  font-size:13px;
  color:#aaa;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:7px;
  margin-top:14px;
}

.day{
  aspect-ratio:1/1;
  border-radius:50%;
  background:#2c2c2e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:#aaa;
}

.done{
  background:#34c759;
  color:white;
  font-weight:700;
}

.today{
  outline:2px solid white;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.small{
  font-size:13px;
  color:#aaa;
  line-height:1.4;
}

.hidden{
  display:none;
}
</style>
</head>

<body>
<div class="app">

<h1>Milestone Tracker</h1>
<p class="sub">Progress survives missed days. Streaks are secondary.</p>

<div class="card">
  <label>Goal Name</label>
  <input id="goalInput" placeholder="Example: No Soda" oninput="saveGoalName()">

  <div class="big" id="mainProgress">0 / 7</div>
  <div class="center" id="milestoneLabel">Current milestone</div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <p class="small" id="message"></p>

  <button id="completeBtn" class="primary" onclick="completeToday()">Complete Today</button>
  <button id="undoBtn" class="secondary hidden" onclick="undoToday()">Undo Today</button>
</div>

<div class="card">
  <div class="stats">
    <div class="stat">
      <div class="number" id="totalDays">0</div>
      <div class="caption">Total Days</div>
    </div>
    <div class="stat">
      <div class="number" id="currentStreak">0</div>
      <div class="caption">Streak</div>
    </div>
    <div class="stat">
      <div class="number" id="bestStreak">0</div>
      <div class="caption">Best</div>
    </div>
  </div>
</div>

<div class="card">
  <h3>Milestones</h3>
  <div id="milestones"></div>
</div>

<div class="card">
  <h3>Last 28 Days</h3>
  <div class="calendar" id="calendar"></div>
</div>

<div class="card">
  <h3>Backup</h3>
  <button class="secondary" onclick="exportData()">Export Backup</button>
  <textarea id="backupBox" placeholder="Backup data appears here. Paste backup here to import."></textarea>
  <button class="secondary" onclick="importData()">Import Backup</button>
</div>

<div class="card">
  <h3>Danger Zone</h3>
  <p class="small">Full reset deletes all progress. It asks for confirmation first.</p>
  <button class="danger" onclick="fullReset()">Full Reset</button>
</div>

</div>

<script>
const milestones = [7, 30, 60, 90, 180, 365];

const today = () => new Date().toISOString().split("T")[0];

let data = JSON.parse(localStorage.getItem("milestoneGoalData")) || {
  goalName:"",
  completedDates:[],
  bestStreak:0
};

function save(){
  data.completedDates = [...new Set(data.completedDates)].sort();
  localStorage.setItem("milestoneGoalData", JSON.stringify(data));
  render();
}

function saveGoalName(){
  data.goalName = document.getElementById("goalInput").value;
  save();
}

function completeToday(){
  const date = today();

  if(data.completedDates.includes(date)){
    return;
  }

  data.completedDates.push(date);

  const streak = calculateCurrentStreak();

  if(streak > data.bestStreak){
    data.bestStreak = streak;
  }

  save();
}

function undoToday(){
  const date = today();
  data.completedDates = data.completedDates.filter(d => d !== date);
  save();
}

function getCurrentMilestone(){
  const total = data.completedDates.length;

  for(let m of milestones){
    if(total < m){
      return m;
    }
  }

  let extra = milestones[milestones.length - 1];

  while(total >= extra){
    extra += 365;
  }

  return extra;
}

function getPreviousMilestone(){
  const total = data.completedDates.length;
  let previous = 0;

  for(let m of milestones){
    if(total >= m){
      previous = m;
    }
  }

  if(total >= 365){
    previous = Math.floor(total / 365) * 365;
  }

  return previous;
}

function calculateCurrentStreak(){
  let streak = 0;
  let date = new Date();

  while(true){
    const check = date.toISOString().split("T")[0];

    if(data.completedDates.includes(check)){
      streak++;
      date.setDate(date.getDate() - 1);
    } else {
      break;
    }
  }

  return streak;
}

function calculateBestStreak(){
  if(data.completedDates.length === 0){
    return 0;
  }

  let sorted = [...data.completedDates].sort();
  let best = 1;
  let current = 1;

  for(let i = 1; i < sorted.length; i++){
    let prev = new Date(sorted[i - 1]);
    let curr = new Date(sorted[i]);

    let diff = (curr - prev) / 86400000;

    if(diff === 1){
      current++;
    } else {
      current = 1;
    }

    if(current > best){
      best = current;
    }
  }

  return best;
}

function renderMilestones(){
  const box = document.getElementById("milestones");
  box.innerHTML = "";

  const total = data.completedDates.length;
  const active = getCurrentMilestone();

  milestones.forEach(m => {
    const row = document.createElement("div");
    row.className = "milestone";

    let status = "Locked";

    if(total >= m){
      status = "Completed";
    } else if(m === active){
      status = "Active";
    }

    row.innerHTML = `
      <strong>${m} days</strong>
      <span class="status">${status}</span>
    `;

    box.appendChild(row);
  });
}

function renderCalendar(){
  const box = document.getElementById("calendar");
  box.innerHTML = "";

  let date = new Date();
  date.setDate(date.getDate() - 27);

  for(let i = 0; i < 28; i++){
    const dateString = date.toISOString().split("T")[0];
    const div = document.createElement("div");

    div.className = "day";
    div.textContent = date.getDate();

    if(data.completedDates.includes(dateString)){
      div.classList.add("done");
    }

    if(dateString === today()){
      div.classList.add("today");
    }

    box.appendChild(div);
    date.setDate(date.getDate() + 1);
  }
}

function exportData(){
  document.getElementById("backupBox").value = JSON.stringify(data, null, 2);
}

function importData(){
  try{
    const imported = JSON.parse(document.getElementById("backupBox").value);

    if(!imported.completedDates || !Array.isArray(imported.completedDates)){
      alert("Invalid backup.");
      return;
    }

    data = imported;

    if(!data.bestStreak){
      data.bestStreak = calculateBestStreak();
    }

    save();
    alert("Backup imported.");
  } catch(e){
    alert("Invalid backup.");
  }
}

function fullReset(){
  const confirmReset = confirm("Delete all progress permanently?");

  if(!confirmReset){
    return;
  }

  data = {
    goalName:"",
    completedDates:[],
    bestStreak:0
  };

  save();
}

function render(){
  const total = data.completedDates.length;
  const currentMilestone = getCurrentMilestone();
  const previousMilestone = getPreviousMilestone();
  const progressInsideMilestone = total - previousMilestone;
  const milestoneSize = currentMilestone - previousMilestone;
  const percent = Math.min((progressInsideMilestone / milestoneSize) * 100, 100);
  const streak = calculateCurrentStreak();
  const best = Math.max(data.bestStreak || 0, calculateBestStreak());

  data.bestStreak = best;

  document.getElementById("goalInput").value = data.goalName;
  document.getElementById("mainProgress").textContent = `${progressInsideMilestone} / ${milestoneSize}`;
  document.getElementById("milestoneLabel").textContent = `${currentMilestone}-day milestone`;
  document.getElementById("bar").style.width = percent + "%";

  document.getElementById("totalDays").textContent = total;
  document.getElementById("currentStreak").textContent = streak;
  document.getElementById("bestStreak").textContent = best;

  const completeBtn = document.getElementById("completeBtn");
  const undoBtn = document.getElementById("undoBtn");

  if(data.completedDates.includes(today())){
    completeBtn.textContent = "Completed Today";
    completeBtn.className = "disabled";
    undoBtn.classList.remove("hidden");
    document.getElementById("message").textContent = "Today is counted. Your milestone progress is saved.";
  } else {
    completeBtn.textContent = "Complete Today";
    completeBtn.className = "primary";
    undoBtn.classList.add("hidden");
    document.getElementById("message").textContent = `${milestoneSize - progressInsideMilestone} completed day(s) left for this milestone.`;
  }

  renderMilestones();
  renderCalendar();
}

render();
</script>

</body>
</html>
