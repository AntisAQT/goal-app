<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goal Tracker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#0f0f0f;
  color:white;
  padding:20px;
}

.app{
  max-width:480px;
  margin:auto;
}

h1{
  text-align:center;
  margin-bottom:6px;
}

.sub{
  text-align:center;
  color:#aaa;
  margin-bottom:24px;
}

.card{
  background:#1c1c1e;
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

label{
  color:#aaa;
  font-size:14px;
}

input{
  width:100%;
  margin-top:8px;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#2c2c2e;
  color:white;
  font-size:16px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.stat{
  background:#2c2c2e;
  border-radius:16px;
  padding:12px;
  text-align:center;
}

.number{
  font-size:24px;
  font-weight:700;
}

.caption{
  color:#aaa;
  font-size:12px;
}

.progress{
  width:100%;
  height:18px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  margin-top:18px;
}

.bar{
  height:100%;
  width:0%;
  background:#34c759;
  transition:.3s;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  margin-top:12px;
}

.primary{
  background:#34c759;
  color:white;
}

.disabled{
  background:#3a3a3c;
  color:#999;
}

.danger{
  background:#ff453a;
  color:white;
}

.secondary{
  background:#2c2c2e;
  color:white;
}

.history{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.day{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#2c2c2e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

.done{
  background:#34c759;
}

.message{
  color:#ccc;
  line-height:1.4;
}
</style>
</head>

<body>
<div class="app">

<h1>Goal Tracker</h1>
<p class="sub">Daily progress. One check-in per day.</p>

<div class="card">
  <label>Goal</label>
  <input id="goalInput" placeholder="Example: No soda" oninput="saveGoalName()">

  <div class="stats">
    <div class="stat">
      <div class="number" id="streak">0</div>
      <div class="caption">Streak</div>
    </div>
    <div class="stat">
      <div class="number" id="target">7</div>
      <div class="caption">Target</div>
    </div>
    <div class="stat">
      <div class="number" id="best">0</div>
      <div class="caption">Best</div>
    </div>
  </div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <p class="message" id="message"></p>

  <button id="completeBtn" class="primary" onclick="completeToday()">Complete Today</button>
  <button class="secondary" onclick="missedDay()">Missed Day</button>
  <button class="danger" onclick="fullReset()">Full Reset</button>
</div>

<div class="card">
  <h3>Recent Days</h3>
  <div class="history" id="history"></div>
</div>

</div>

<script>
const today = () => new Date().toISOString().split("T")[0];

let data = JSON.parse(localStorage.getItem("goalAppData")) || {
  goalName:"",
  streak:0,
  best:0,
  target:7,
  lastCompleted:null,
  completedDates:[]
};

function save(){
  localStorage.setItem("goalAppData", JSON.stringify(data));
  render();
}

function saveGoalName(){
  data.goalName = document.getElementById("goalInput").value;
  save();
}

function completeToday(){
  const currentDate = today();

  if(data.lastCompleted === currentDate){
    return;
  }

  data.completedDates.push(currentDate);
  data.lastCompleted = currentDate;
  data.streak++;

  if(data.streak > data.best){
    data.best = data.streak;
  }

  if(data.streak >= data.target){
    if(data.target === 7){
      data.target = 30;
    } else if(data.target === 30){
      data.target = 60;
    } else if(data.target === 60){
      data.target = 90;
    } else {
      data.target += 30;
    }
  }

  save();
}

function missedDay(){
  data.streak = 0;
  save();
}

function fullReset(){
  data = {
    goalName:"",
    streak:0,
    best:0,
    target:7,
    lastCompleted:null,
    completedDates:[]
  };
  save();
}

function render(){
  document.getElementById("goalInput").value = data.goalName;
  document.getElementById("streak").textContent = data.streak;
  document.getElementById("target").textContent = data.target;
  document.getElementById("best").textContent = data.best;

  let percent = Math.min((data.streak / data.target) * 100, 100);
  document.getElementById("bar").style.width = percent + "%";

  const btn = document.getElementById("completeBtn");

  if(data.lastCompleted === today()){
    btn.textContent = "Completed Today";
    btn.className = "disabled";
    document.getElementById("message").textContent = "Today is already counted. Come back tomorrow.";
  } else {
    btn.textContent = "Complete Today";
    btn.className = "primary";
    document.getElementById("message").textContent = `${data.target - data.streak} day(s) left until the next upgrade.`;
  }

  const history = document.getElementById("history");
  history.innerHTML = "";

  const recent = data.completedDates.slice(-21);

  recent.forEach((date, index) => {
    const div = document.createElement("div");
    div.className = "day done";
    div.textContent = index + 1;
    div.title = date;
    history.appendChild(div);
  });
}

render();
</script>

</body>
</html>
